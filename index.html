["occhi","In «Chi è questa» (v. 5) di chi sono gli occhi che si volgono?",["del poeta","della donna","di Amore"],1,"In «Tanto gentile» (v. 4) di chi sono gli occhi che non osano guardare?",["della donna","di chi la guarda","di Amore"],1],
["donna","In «Chi è questa» (v. 7) che cosa vuol dire «d’umiltà donna»?",["la donna che il poeta ama in segreto","la signora dell’umiltà, che la possiede al massimo grado","una donna umile e modesta"],1,"In «Tanto gentile» (v. 2) che cosa vuol dire «la donna mia»?",["la donna amata dal poeta","la signora dell’umiltà","una dea"],0],
["gentil / gentile","In «Chi è questa» (v. 10) che cosa si inchina davanti alla donna?",["ogni virtù, ogni gentilezza","gli uomini che la guardano","Amore"],0,"In «Tanto gentile» (v. 1) a chi si riferisce «gentile»?",["alla donna, nobile d’animo e cortese","all’aria, che si illumina","a Dante, che la guarda"],0]];
var GUIN=["âre","pare","vertute","salute","mira","ira","gira","nostra"];
var GUIN_OK=["âre","pare","vertute","salute"];

<script>
/* ---------- nucleo ---------- */
var K="silenzio-della-piazza-v1";
var S={team:"",mem:"",a:{},d:{},fb:{},help:{},unlocked:false,draw:{},screen:"start"};
try{var raw=localStorage.getItem(K);if(raw){var o=JSON.parse(raw);for(var k0 in o)S[k0]=o[k0];}}catch(e){}
var saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}},250)}
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function wc(s){var m=String(s||"").trim().match(/\S+/g);return m?m.length:0}
function norm(s){return String(s||"").toLowerCase().replace(/[’']/g,"'").replace(/[.,;:!?«»"()]/g,"").trim()}
function D(k){return !!S.d[k]}
function A(k){return S.a[k]==null?"":S.a[k]}
function setFb(k,kind,msg){S.fb[k]={kind:kind,msg:msg};save()}
function FB(k){var f=S.fb[k];return f&&f.msg?'<div class="fb '+f.kind+'" role="status">'+f.msg+'</div>':""}
function tag(k){return D(k)?'<span class="done-tag">fatto</span>':""}
function ta(k,ph,min,max,rows){
  var v=A(k);
  return '<textarea id="f-'+k+'" data-k="'+k+'" placeholder="'+esc(ph||"")+'" rows="'+(rows||4)+'">'+esc(v)+'</textarea>'+
  '<div class="count'+(max&&wc(v)>max?' over':'')+'" data-cnt="'+k+'" data-min="'+(min||0)+'" data-max="'+(max||0)+'">'+cntTxt(v,min,max)+'</div>';
}
function cntTxt(v,min,max){var n=wc(v);return n+" parole"+(min?" · almeno "+min:"")+(max?" · al massimo circa "+max:"")}
function roomDone(i){return D(ROOMS[i].id+".S")}
function lettersDone(){return ROOMS.filter(function(r){return D(r.id+".S")}).length}
/* ---------- barra, testo, aiuti ---------- */
function renderSeals(){
  $("#seals").innerHTML=ROOMS.map(function(r,i){var on=roomDone(i);return '<span class="seal'+(on?' on':'')+'" title="Stanza '+(i+1)+'">'+(on?r.L:(i+1))+'</span>'}).join("")+
  '<span class="seal'+(S.unlocked?' on':'')+'" title="Finale" style="margin-left:6px">'+(S.unlocked?'★':'·')+'</span>';
}
function renderText(){
  var h='<div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="eyebrow">Guido Cavalcanti · sonetto</div><button class="btn sm closeText" type="button" data-act="closeText">Chiudi</button></div>';
  h+='<h3 style="margin-bottom:10px">Chi è questa che vén, ch’ogn’om la mira</h3>';
  POEM.forEach(function(v,i){h+='<div class="verse'+(v[1]?' gap':'')+'"><i>'+(i+1)+'</i><span>'+v[0]+'</span></div>'});
  h+='<div class="notes">'+NOTES.map(function(n,i){return '<span><b>'+(i+1)+'.</b> '+esc(n)+'</span>'}).join("")+'</div>';
  h+='<details><summary>Il poeta</summary><p class="muted" style="margin:8px 0 0;font-size:.9rem">'+esc(AUTORE)+'</p></details>';
  $("#text").innerHTML=h;
}
function openOv(html){
  var o=$("#ov");if(!o){o=document.createElement("div");o.id="ov";o.style.cssText="position:fixed;inset:0;z-index:40;background:rgba(10,12,28,.6);display:grid;place-items:center;padding:16px";document.body.appendChild(o);}
  o.innerHTML='<div class="card" style="max-width:640px;width:100%;max-height:90vh;overflow:auto;margin:0">'+html+'<div class="row" style="justify-content:flex-end"><button class="btn pri" type="button" data-act="closeOv">Chiudi</button></div></div>';
  o.hidden=false;
}
function closeOv(){var o=$("#ov");if(o)o.hidden=true}
function helpHtml(){
  var inRoom=/^r\d$/.test(S.screen);
  var names={nota:"Nota",ril:"Rilettura",conf:"Confronto"};
  var h='<h3>Carte aiuto</h3><p class="muted">Ogni carta si usa una sola volta in tutto il gioco. Tocca una carta per spenderla nella stanza in cui ti trovi.</p>';
  ["nota","ril","conf"].forEach(function(c){
    var used=S.help[c];
    h+='<div class="card" style="margin:0 0 10px;padding:14px 16px"><b>'+names[c]+'</b> ';
    if(used){h+='<span class="muted">· usata nella stanza '+used.slice(1)+'</span><p style="margin:8px 0 0">'+esc(HELP[used][c])+'</p>'}
    else if(inRoom){h+='<div style="margin-top:8px"><button class="btn sm" type="button" data-act="useHelp" data-v="'+c+'">Usa questa carta</button></div>'}
    else{h+='<span class="muted">· disponibile</span>'}
    h+='</div>';
  });
  return h;
}
/* ---------- navigazione ---------- */
function go(sc){S.screen=sc;save();render();window.scrollTo(0,0);$("#text").classList.remove("open")}
function render(){
  var y=window.scrollY;
  renderSeals();
  var st=$("#stage"),sc=S.screen;
  if(sc==="start")st.innerHTML=viewStart();
  else if(sc==="hub")st.innerHTML=viewHub();
  else if(sc==="finale")st.innerHTML=viewFinale();
  else if(sc==="consegna")st.innerHTML=viewConsegna();
  else if(ROOMV[sc])st.innerHTML=ROOMV[sc]();
  if(sc==="finale"||sc==="consegna")setTimeout(initCanvases,0);
  window.scrollTo(0,y);
}
/* ---------- schermate iniziali ---------- */
function viewStart(){
  return '<section class="hero"><div class="eyebrow">Escape room · Dolce stil novo</div>'+
  '<h1>Il silenzio della piazza</h1>'+
  '<p class="lead">Firenze, fine Duecento. Una donna attraversa la piazza. L’aria trema di luce, Amore cammina accanto a lei e tutti si fermano a guardarla. Nessuno riesce a parlare: restano solo i sospiri.</p>'+
  '<p style="max-width:40em">Voi siete tra la folla ammutolita. Per ritrovare le parole attraversate quattro stanze della mente di Guido Cavalcanti, il poeta che ha visto la scena e non sa come raccontarla. Ogni sigillo vi restituisce una lettera. Con le quattro lettere ricomporrete una parola sola, e allora scriverete ciò che nessuno in piazza riesce a dire.</p></section>'+
  '<div class="card" style="max-width:640px"><h3>La squadra</h3><p class="muted">Un dispositivo per squadra. Le risposte restano salvate su questo dispositivo.</p>'+
  '<label for="f-team" class="eyebrow">Nome della squadra</label><input type="text" id="f-team" data-k="S.team" value="'+esc(S.team)+'" style="margin:4px 0 12px">'+
  '<label for="f-mem" class="eyebrow">Componenti</label><input type="text" id="f-mem" data-k="S.mem" value="'+esc(S.mem)+'" placeholder="Nomi separati da virgola" style="margin:4px 0 14px">'+
  '<p class="muted">Ruoli a rotazione a ogni stanza: chi legge ad alta voce, chi scrive, chi cerca le note, chi tiene il tempo.</p>'+
  '<button class="btn pri" type="button" data-act="begin">Entra nella prima stanza</button></div>';
}
function viewHub(){
  var h='<h2>Mappa della mente</h2><p class="muted" style="margin:6px 0 16px">Le stanze si aprono una dopo l’altra. Una squadra che sbaglia un sigillo riceve un indizio, mai la soluzione.</p><div class="rooms">';
  ROOMS.forEach(function(r,i){
    var ok=roomDone(i),lock=i>0&&!roomDone(i-1);
    h+='<button class="room'+(ok?' ok':'')+'" type="button" '+(lock?'disabled ':'')+'data-act="goRoom" data-v="'+r.id+'"><span class="eyebrow">Stanza '+(i+1)+'</span><span class="n">'+r.n+'</span><span class="muted">'+r.sk+'</span><span class="st">'+(ok?"sigillo "+r.L+" raccolto":lock?"chiusa":"aperta")+'</span></button>';
  });
  h+='<button class="room'+(D("fin")?' ok':'')+'" type="button" '+(S.unlocked?'':'disabled ')+'data-act="go" data-v="finale"><span class="eyebrow">Finale</span><span class="n">La parola</span><span class="muted">Analisi e interpretazione scritte</span><span class="st">'+(S.unlocked?"aperta":"chiusa")+'</span></button></div>';
  if(lettersDone()===4&&!S.unlocked){
    h+='<div class="sigillo" style="margin-top:20px"><h3>Le quattro lettere</h3><p>Sono arrivate in ordine sparso. Riordinatele: l’indizio è nel v. 1, dove si dice che cosa fa «ogn’om» quando la donna passa.</p><div class="letters">'+
    ROOMS.map(function(r){return '<span class="seal on">'+r.L+'</span>'}).join("")+'</div>'+
    '<div class="row"><input type="text" id="f-ana" data-k="ana" value="'+esc(A("ana"))+'" style="max-width:240px" placeholder="La parola" aria-label="La parola formata dalle lettere"><button class="btn pri" type="button" data-act="ana">Pronuncia la parola</button></div>'+FB("ana")+'</div>';
  }
  return h;
}
/* ---------- azioni ---------- */
var ACT={
 begin:function(){go("hub")},
 go:function(el){go(el.dataset.v)},
 goRoom:function(el){go(el.dataset.v)},
 closeText:function(){$("#text").classList.remove("open")},
 closeOv:closeOv,
 useHelp:function(el){var c=el.dataset.v;if(!S.help[c]&&/^r\d$/.test(S.screen)){S.help[c]=S.screen;save();openOv(helpHtml())}},
 ana:function(){
   if(norm(A("ana"))==="mira"){S.unlocked=true;setFb("ana","good","Tutti la mirano, e le parole tornano.");save();go("finale")}
   else setFb("ana","bad","Le lettere sono giuste, l’ordine no. Rileggi il v. 1: che cosa fa ognuno quando lei passa?");render()
 }
};
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el||el.disabled)return;
  var f=ACT[el.dataset.act];if(f){f(el);if(["closeOv","closeText","useHelp","go","goRoom","begin"].indexOf(el.dataset.act)<0&&el.dataset.act!=="ana")render();}
});
function onField(t){
  var k=t.dataset.k;if(!k)return;
  var v=t.type==="checkbox"?t.checked:t.value;
  if(k.indexOf("S.")===0)S[k.slice(2)]=v;else S.a[k]=v;
  save();
  var c=document.querySelector('[data-cnt="'+k+'"]');
  if(c){var mn=+c.dataset.min,mx=+c.dataset.max;c.textContent=cntTxt(String(v),mn,mx);c.classList.toggle("over",!!mx&&wc(v)>mx)}
}
document.addEventListener("input",function(e){onField(e.target)});
document.addEventListener("change",function(e){onField(e.target)});
$("#helpbtn").addEventListener("click",function(){openOv(helpHtml())});
$("#textbtn").addEventListener("click",function(){$("#text").classList.add("open")});
$("#homebtn").addEventListener("click",function(){go(S.screen==="start"?"start":"hub")});
</script>
<script>
/* ---------- stanze 1 e 2 ---------- */
var ROOMV={};
var SIG={r1:/^mena$/,r2:/^ira$/,r3:/^amor(e)?$/,r4:/^(la )?rima$/};
var SIGH={r1:"Non è questa. Guarda la nota 3: «e mena seco Amor» vale «e conduce con sé l’Amore». Qual è il verbo che regge «Amor»?",
 r2:"Non è questa. Guarda la parola che chiude il v. 8, in rima con «mira», e la nota 8.",
 r3:"Non è questa. Cerca la parola con l’iniziale maiuscola che compare nel v. 3 e di nuovo nel v. 6.",
 r4:"Non è questa. Pensa a ciò che lega la fine di un verso alla fine di un altro."};
var SIGQ={r1:"Nella parafrasi del v. 3 avete letto «e mena seco Amor». Scrivete il verbo che regge «Amor», così come compare nel testo.",
 r2:"Nei vv. 7-8 la donna è «d’umiltà donna» e ogni altra donna, in confronto a lei, viene chiamata con il contrario di «umiltà». Scrivete quella parola.",
 r3:"Una parola personificata compare al v. 3 e ritorna al v. 6: è quella che avete riconosciuto come «ripresa». Scrivetela come compare nel testo.",
 r4:"Cavalcanti riprende da Guinizelli quattro parole che occupano la stessa posizione nel verso. Scrivete come si chiama questa posizione (una parola)."};
function roomHead(i,intro){var r=ROOMS[i];return '<div class="eyebrow">Stanza '+(i+1)+' di 4 · '+r.sk+'</div><h2 style="margin:4px 0 8px">'+r.n+'</h2><p class="muted" style="max-width:44em">'+intro+'</p>'}
function sigCard(i){
  var r=ROOMS[i],id=r.id;
  if(D(id+".S"))return '<div class="sigillo"><div class="row"><span class="seal on" style="width:56px;height:56px;font-size:1.7rem">'+r.L+'</span><div><b>Sigillo raccolto: la lettera '+r.L+'</b><div class="muted">La stanza si apre.</div></div></div><div style="margin-top:12px"><button class="btn pri" type="button" data-act="'+(i<3?'goRoom" data-v="'+ROOMS[i+1].id:'go" data-v="hub')+'">'+(i<3?'Vai alla stanza '+(i+2):'Torna alla mappa')+'</button></div></div>';
  return '<div class="sigillo"><div class="eyebrow">Il sigillo</div><p style="margin:6px 0 10px">'+SIGQ[id]+'</p><div class="row"><input type="text" id="f-'+id+'.sin" data-k="'+id+'.sin" value="'+esc(A(id+".sin"))+'" style="max-width:260px" aria-label="Risposta del sigillo"><button class="btn pri" type="button" data-act="sig" data-v="'+id+'">Prova il sigillo</button></div>'+FB(id+".S")+'</div>';
}
ACT.sig=function(el){var id=el.dataset.v;if(SIG[id].test(norm(A(id+".sin")))){S.d[id+".S"]=true;setFb(id+".S","good","")}else setFb(id+".S","bad",SIGH[id])};
/* ---- stanza 1 ---- */
function errGroup(w){var n=norm(w);for(var i=0;i<ERR.length;i++)if(ERR[i].w.indexOf(n)>=0)return i;return -1}
function r1items(){
  var sel=S.a["r1.sel"]||[],seen={},out=[];
  sel.forEach(function(id){var p=+id.split("-")[0],w=PARA[p][1].split(" ")[+id.split("-")[1]],g=errGroup(w),key=g>=0?"g"+g:"x"+id;
    if(!seen[key]){seen[key]=1;out.push({key:key,g:g,lbl:g>=0?ERR[g].w.join(" "):norm(w),vv:PARA[p][0]})}});
  return out;
}
ACT.tok=function(el){if(D("r1.A"))return;var s=S.a["r1.sel"]||[],id=el.dataset.v,i=s.indexOf(id);if(i>=0)s.splice(i,1);else s.push(id);S.a["r1.sel"]=s;S.fb["r1.A"]=null;save()};
ACT.r1A=function(){
  var it=r1items(),found=it.filter(function(x){return x.g>=0}).length,wrong=it.length-found;
  if(!it.length)return setFb("r1.A","bad","Tocca le parole che ti sembrano sbagliate.");
  if(wrong)return setFb("r1.A","bad","Hai segnalato "+wrong+" "+(wrong>1?"parole corrette":"parola corretta")+". Rileggi il sonetto con le note. Errori trovati finora: "+found+" su 6.");
  if(found<6)return setFb("r1.A","bad","Errori trovati: "+found+" su 6. Ne mancano ancora.");
  var probs=[];
  it.forEach(function(x){
    if(!ERR[x.g].re.test(norm(A("r1.fix."+x.key))))probs.push("«"+x.lbl+"»: "+ERR[x.g].h);
    else if(wc(A("r1.why."+x.key))<3)probs.push("«"+x.lbl+"»: spiega meglio come te ne sei accorto.");
  });
  if(probs.length)return setFb("r1.A","bad","Sei sulla strada giusta. Da rivedere:<br>"+probs.join("<br>"));
  S.d["r1.A"]=true;setFb("r1.A","good","Tutti e sei gli errori smascherati.");
};
ACT.r1B=function(){
  var ok=[0,1,2,3,4].every(function(i){return S.a["r1.c"+i]});
  if(wc(A("r1.B"))<25)return setFb("r1.B","bad","La parafrasi è troppo breve: spiega tutti e tre i versi.");
  if(!ok)return setFb("r1.B","bad","Spunta tutte le domande di controllo, dopo aver verificato davvero la tua parafrasi.");
  S.d["r1.B"]=true;setFb("r1.B","good","Parafrasi pronta per la consegna.");
};
ROOMV.r1=function(){
  var h=roomHead(0,"La piazza è bloccata da un guardiano che parla male e che ha dimenticato la parte centrale del discorso. Per passare dovete smascherare la sua parafrasi e scriverne una vostra.");
  var sel=S.a["r1.sel"]||[],items=r1items(),done=D("r1.A");
  h+='<div class="card prova"><div class="eyebrow">Prova A</div><h3>La parafrasi bugiarda'+tag("r1.A")+'</h3><p>Il guardiano ha parafrasato il sonetto, ma ha messo sei parole sbagliate. Tocca le parole sospette, poi scrivi quella giusta e come l’hai capito. I vv. 9-11 mancano: sono la Prova B.</p>';
  PARA.forEach(function(p,pi){
    h+='<p class="para"><span class="lbl">'+p[0]+'</span>'+p[1].split(" ").map(function(w,wi){var id=pi+"-"+wi,on=sel.indexOf(id)>=0,g=errGroup(w);
      return '<button type="button" class="tok'+(done&&g>=0?' found':on?' sel':'')+'" data-act="tok" data-v="'+id+'" aria-pressed="'+on+'"'+(done?' disabled':'')+'>'+esc(w)+'</button>'}).join(" ")+'</p>';
  });
  items.forEach(function(x){
    h+='<div class="fix"><span class="w">'+esc(x.lbl)+' <small class="muted">('+x.vv+')</small></span><input type="text" id="f-r1.fix.'+x.key+'" data-k="r1.fix.'+x.key+'" value="'+esc(A("r1.fix."+x.key))+'" placeholder="parola giusta" aria-label="Parola giusta per '+esc(x.lbl)+'"'+(done?' disabled':'')+'>'+
    '<input type="text" id="f-r1.why.'+x.key+'" data-k="r1.why.'+x.key+'" value="'+esc(A("r1.why."+x.key))+'" placeholder="come l’hai capito (nota, contesto, rima, buon senso)" aria-label="Come lo hai capito"'+(done?' disabled':'')+'></div>';
  });
  if(!done)h+='<div style="margin-top:12px"><button class="btn pri" type="button" data-act="r1A">Controlla gli errori</button></div>';
  h+=FB("r1.A")+'</div>';
  if(done){
    h+='<div class="card prova"><div class="eyebrow">Prova B</div><h3>La parafrasi mancante'+tag("r1.B")+'</h3><p>Scrivete in prosa moderna, in non più di 4 righe, la parafrasi dei vv. 9-11. La frase finale deve filare da sola, come se il sonetto non esistesse.</p>'+
    ta("r1.B","Parafrasi dei vv. 9-11…",25,60,5)+'<div style="margin-top:8px"><b>Prima di consegnare, controllate:</b>'+
    CHK1.map(function(t,i){return '<label style="display:flex;gap:10px;align-items:flex-start;margin:6px 0"><input type="checkbox" id="f-r1.c'+i+'" style="width:22px;height:22px;margin-top:3px" data-k="r1.c'+i+'"'+(S.a["r1.c"+i]?' checked':'')+(D("r1.B")?' disabled':'')+'><span>'+t+'</span></label>'}).join("")+'</div>'+
    (D("r1.B")?'':'<button class="btn pri" type="button" data-act="r1B">Consegna la parafrasi</button>')+FB("r1.B")+'</div>';
  }
  if(done&&D("r1.B"))h+=sigCard(0);
  return h;
};
/* ---- stanza 2 ---- */
function accepted(ci){return CARDS[ci][2]}
ACT.pick=function(el){var v=el.dataset.v;S.a["r2.sel"]=(S.a["r2.sel"]===v?"":v);save()};
ACT.put=function(el){
  var s=S.a["r2.sel"];if(s===""||s==null||D("r2.A"))return;
  var pl=S.a["r2.pl"]||{},b=el.dataset.v;
  if(b==="pool")delete pl[s];else pl[s]=b;
  S.a["r2.pl"]=pl;S.a["r2.sel"]="";S.a["r2.bad"]=(S.a["r2.bad"]||[]).filter(function(x){return x!==s});S.fb["r2.A"]=null;save();
};
ACT.r2A=function(){
  var pl=S.a["r2.pl"]||{},left=CARDS.length-Object.keys(pl).length;
  if(left)return setFb("r2.A","bad","Hai ancora "+left+" "+(left>1?"carte":"carta")+" nel mazzo.");
  var bad=[];CARDS.forEach(function(c,i){if(accepted(i).indexOf(pl[i])<0)bad.push(String(i))});
  S.a["r2.bad"]=bad;
  if(bad.length)return setFb("r2.A","bad",(CARDS.length-bad.length)+" carte su "+CARDS.length+" sono al posto giusto. Quelle con il bordo rosso vanno riviste.");
  if(wc(A("r2.A2"))<12)return setFb("r2.A","bad","Le carte sono a posto. Ora scrivete quali sono le tre carte che potevano stare in due campi e perché.");
  S.d["r2.A"]=true;setFb("r2.A","good","Campi in ordine.");
};
var ORD0=["divino","parola","mente","amore","virtu","vista"];
ACT.mv=function(el){var p=el.dataset.v.split(":"),i=+p[0],d=+p[1],o=S.a["r2.ord"]||ORD0.slice();var j=i+d;if(j<0||j>=o.length)return;var t=o[i];o[i]=o[j];o[j]=t;S.a["r2.ord"]=o;S.fb["r2.B"]=null;save()};
function bname(id){return BK.filter(function(b){return b[0]===id})[0][1]}
ACT.r2B=function(){
  var o=S.a["r2.ord"]||ORD0.slice(),ix=function(x){return o.indexOf(x)};
  if(!(ix("vista")<ix("amore")&&ix("amore")<ix("parola")))return setFb("r2.B","bad","Rileggi i vv. 1-4: che cosa succede per primo a chi vede passare la donna? Che cosa viene subito dopo, prima che tutti restino senza parole?");
  if(ix("mente")!==o.length-1)return setFb("r2.B","bad","Quale campo chiude il sonetto, nei vv. 12-14?");
  if(wc(A("r2.B"))<40)return setFb("r2.B","bad","Scrivete una frase per ogni passaggio, citando almeno una parola per campo.");
  S.d["r2.B"]=true;setFb("r2.B","good","Catena ricostruita.");
};
ACT.r2C=function(){
  var hit=FORMS.map(function(f,i){return f[2].test(norm(A("r2.C"+i)))}),n=hit.filter(Boolean).length;
  if(n<FORMS.length)return setFb("r2.C","bad",n+" forme su "+FORMS.length+" sono giuste. Da rivedere, con le note e con il contesto: "+FORMS.filter(function(f,i){return !hit[i]}).map(function(f){return "«"+f[0]+"» ("+f[1]+")"}).join(", ")+".");
  if(wc(A("r2.Cw"))<12)return setFb("r2.C","bad","Le forme sono giuste. Spiegate ora come avete capito il significato di due di esse.");
  S.d["r2.C"]=true;setFb("r2.C","good","Forme antiche tradotte.");
};
ACT.kw=function(el){if(D("r2.D"))return;var s=S.a["r2.kw"]||[],v=el.dataset.v,i=s.indexOf(v);if(i>=0)s.splice(i,1);else if(s.length<4)s.push(v);S.a["r2.kw"]=s;save()};
ACT.r2D=function(){
  var s=S.a["r2.kw"]||[];
  if(s.length!==4)return setFb("r2.D","bad","Scegliete esattamente quattro parole-chiave.");
  var short=s.filter(function(w){return wc(A("r2.D."+w))<6});
  if(short.length)return setFb("r2.D","bad","Spiegate meglio: "+short.join(", ")+".");
  S.d["r2.D"]=true;setFb("r2.D","good","Parole-chiave motivate.");
};
ROOMV.r2=function(){
  var h=roomHead(1,"Davanti alla donna le parole di Guido si sono sparpagliate come carte sul pavimento. Rimetterle in ordine significa capire come il sonetto organizza il suo lessico.");
  var pl=S.a["r2.pl"]||{},sel=S.a["r2.sel"],bad=S.a["r2.bad"]||[],doneA=D("r2.A");
  function card(i){var c=CARDS[i];return '<button type="button" class="cd'+(sel===String(i)?' sel':'')+(bad.indexOf(String(i))>=0?' bad':'')+'" data-act="pick" data-v="'+i+'"'+(doneA?' disabled':'')+'>'+esc(c[0])+'<small>v.'+c[1]+'</small></button>'}
  h+='<div class="card prova"><div class="eyebrow">Prova A</div><h3>Le '+CARDS.length+' carte'+tag("r2.A")+'</h3><p>Tocca una carta, poi tocca il campo in cui metterla. Per rimetterla nel mazzo, tocca il mazzo. Tre carte possono stare in due campi: scegliete dove metterle e giustificate la scelta.</p>';
  h+='<div class="pool'+(sel?' target':'')+'" data-act="put" data-v="pool" role="group" aria-label="Mazzo">'+CARDS.map(function(c,i){return pl[i]?"":card(i)}).join("")+(Object.keys(pl).length===CARDS.length?'<span class="muted">Mazzo vuoto</span>':'')+'</div><div class="buckets">';
  BK.forEach(function(b){h+='<div class="bucket'+(sel?' target':'')+'" data-act="put" data-v="'+b[0]+'" role="group" aria-label="'+b[1]+'"><h4>'+b[1]+'</h4><div class="in">'+CARDS.map(function(c,i){return pl[i]===b[0]?card(i):""}).join("")+'</div></div>'});
  h+='</div><div style="margin-top:14px"><b>Le tre carte doppie</b><p class="muted" style="margin:2px 0 6px">Quali sono e perché potevano stare in due campi?</p>'+ta("r2.A2","Scrivete qui…",12,0,3)+'</div>';
  if(!doneA)h+='<div style="margin-top:10px"><button class="btn pri" type="button" data-act="r2A">Controlla le carte</button></div>';
  h+=FB("r2.A")+'</div>';
  if(doneA){
    var o=S.a["r2.ord"]||ORD0.slice(),dB=D("r2.B");
    h+='<div class="card prova"><div class="eyebrow">Prova B</div><h3>La catena'+tag("r2.B")+'</h3><p>Il sonetto racconta che cosa accade a chi vede passare la donna. Disponete i sei campi nell’ordine in cui l’esperienza si svolge, poi scrivete una frase per ogni passaggio. Quale campo apre la catena e quale la chiude? Che cosa cambia, passo dopo passo, in chi guarda?</p><div class="order">'+
    o.map(function(id,i){return '<div class="it"><b class="muted" style="font-family:var(--mono)">'+(i+1)+'</b><span>'+bname(id)+'</span>'+(dB?'':'<button class="btn sm" type="button" data-act="mv" data-v="'+i+':-1" aria-label="Sposta su">su</button><button class="btn sm" type="button" data-act="mv" data-v="'+i+':1" aria-label="Sposta giù">giù</button>')+'</div>'}).join("")+'</div>'+
    ta("r2.B","Una frase per ogni passaggio, con una parola citata dal testo…",40,0,6)+(dB?'':'<div style="margin-top:10px"><button class="btn pri" type="button" data-act="r2B">Controlla la catena</button></div>')+FB("r2.B")+'</div>';
  }
  if(D("r2.B")){
    var dC=D("r2.C");
    h+='<div class="card prova"><div class="eyebrow">Prova C</div><h3>Le forme antiche'+tag("r2.C")+'</h3><p>Cinque parole del sonetto hanno una forma diversa dall’italiano di oggi. Scrivete la forma moderna.</p>'+
    FORMS.map(function(f,i){return '<div class="fix2"><span class="w">'+esc(f[0])+' <small class="muted">('+f[1]+')</small></span><input type="text" id="f-r2.C'+i+'" data-k="r2.C'+i+'" value="'+esc(A("r2.C"+i))+'" aria-label="Forma moderna di '+esc(f[0])+'"'+(dC?' disabled':'')+'></div>'}).join("")+
    '<p class="muted" style="margin:12px 0 4px">Scegliete due di queste forme e spiegate come ne avete capito il significato (nota, contesto, rima, somiglianza con parole di oggi).</p>'+ta("r2.Cw","",12,0,3)+(dC?'':'<div style="margin-top:10px"><button class="btn pri" type="button" data-act="r2C">Controlla</button></div>')+FB("r2.C")+'</div>';
  }
  if(D("r2.C")){
    var kw=S.a["r2.kw"]||[],dD=D("r2.D");
    h+='<div class="card prova"><div class="eyebrow">Prova D</div><h3>Le parole-chiave'+tag("r2.D")+'</h3><p>Scegliete quattro parole-chiave del sonetto (né tre né cinque). Per ognuna scrivete una riga: è ripetuta? sta in rima? è al centro di un campo? entra in un contrasto?</p><div class="chips">'+
    KW.map(function(w){return '<button type="button" class="chip'+(kw.indexOf(w)>=0?' on':'')+'" data-act="kw" data-v="'+w+'" aria-pressed="'+(kw.indexOf(w)>=0)+'"'+(dD?' disabled':'')+'>'+w+'</button>'}).join("")+'</div>'+
    kw.map(function(w){return '<div style="margin-top:10px"><b style="font-family:var(--display);font-size:1.15rem">'+w+'</b>'+ta("r2.D."+w,"Perché è una parola-chiave?",6,0,2)+'</div>'}).join("")+(dD?'':'<div style="margin-top:10px"><button class="btn pri" type="button" data-act="r2D">Conferma le parole-chiave</button></div>')+FB("r2.D")+'</div>';
  }
  if(D("r2.D"))h+=sigCard(1);
  return h;
};
</script>
<script>
/* ---------- stanze 3 e 4 ---------- */
function selH(k,opts,dis,lbl){
  var cur=A(k);
  return '<select id="f-'+k+'" data-k="'+k+'"'+(dis?' disabled':'')+' aria-label="'+esc(lbl||k)+'">'+opts.map(function(o){var v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'"'+(cur===v?' selected':'')+'>'+esc(l||"— scegli —")+'</option>'}).join("")+'</select>';
}
function sameSet(a,b){a=(a||[]).slice().sort(function(x,y){return x-y});return a.length===b.length&&a.every(function(x,i){return x===b[i]})}
/* ---- stanza 3 ---- */
ACT.r3A=function(){
  var bad=[];RIMA.forEach(function(w,i){if(A("r3.rm."+i)!==RIMA_OK.charAt(i))bad.push(i)});
  S.a["r3.bad"]=bad;
  var q=[A("r3.q1")==="quartine",A("r3.q2")==="terzine",A("r3.q3")==="endecasillabi",A("r3.q4")==="invertito (CDE EDC)",norm(A("r3.end")).replace(/^-/,"")==="ira"];
  if(bad.length)return setFb("r3.A","bad","Lo schema non torna: "+(14-bad.length)+" versi su 14 hanno la lettera giusta. Controllate quelli segnati in rosso.");
  if(!q.every(Boolean))return setFb("r3.A","bad","Lo schema è giusto. Rivedete le risposte sotto: "+(q.filter(Boolean).length)+" su 5 sono corrette.");
  S.d["r3.A"]=true;setFb("r3.A","good","Schema metrico: ABBA ABBA CDE EDC.");
};
ACT.syl=function(el){
  var p=el.dataset.v.split(":"),k="r3."+p[0],s=S.a[k]||[],n=+p[1],i=s.indexOf(n);if(D("r3.B"))return;
  if(i>=0)s.splice(i,1);else s.push(n);S.a[k]=s;S.fb["r3.B"]=null;save();
};
ACT.r3B=function(){
  var m=[];
  if(!sameSet(S.a["r3.s2"],SYL2.ok))m.push("Nel v. 2 gli accenti principali cadono su altre sillabe: leggete ad alta voce battendo il tempo.");
  if(!sameSet(S.a["r3.s7"],SYL7.ok))m.push("Nel v. 7 gli accenti principali cadono su altre sillabe: attenzione a «umiltà», che è una parola tronca.");
  if(A("r3.sill")!=="11")m.push("Contate le sillabe dei due versi, leggendo «l’âre» come due sillabe: quante sono?");
  if(A("r3.piane")!=="piane")m.push("Guardate dove cade l’accento nelle parole in rima: «mira», «pare», «salute»…");
  if(A("r3.rit")!=="regolare e fluido")m.push("Guardate la sequenza degli accenti nei due versi: com’è il ritmo?");
  if(m.length)return setFb("r3.B","bad",m.join("<br>"));
  if(wc(A("r3.Bw"))<20)return setFb("r3.B","bad","Tutto giusto. Rispondete ora alla domanda sull’effetto dei suoni.");
  S.d["r3.B"]=true;setFb("r3.B","good","Scansione e ritmo a posto.");
};
ACT.r3C=function(){
  var bad=[];FIG.forEach(function(f,i){if(A("r3.fg."+i)!==f[1])bad.push(i)});
  S.a["r3.fbad"]=bad;
  if(bad.length)return setFb("r3.C","bad",(FIG.length-bad.length)+" figure su "+FIG.length+" sono giuste. Quelle in rosso vanno riviste.");
  S.d["r3.C"]=true;setFb("r3.C","good","Tutte le figure riconosciute.");
};
ACT.r3D=function(){
  if(A("r3.per")!=="5"||A("r3.coin")!=="no"||A("r3.str")!=="seconda quartina")return setFb("r3.D","bad","Contate i segni che chiudono il periodo (? ! .): i due punti non lo chiudono. Poi confrontate la fine di ogni periodo con la fine di ogni strofa.");
  S.d["r3.D"]=true;setFb("r3.D","good","Cinque periodi: la seconda quartina ne contiene due, uno brevissimo (v. 5) e uno di tre versi (vv. 6-8).");
};
ROOMV.r3=function(){
  var h=roomHead(2,"Il poeta non riesce a parlare, ma la sala rimbomba di echi: rime, accenti, suoni che ritornano. Per attraversarla dovete sentire il testo, non solo leggerlo.");
  var dA=D("r3.A"),bad=S.a["r3.bad"]||[];
  h+='<div class="card prova"><div class="eyebrow">Prova A</div><h3>Lo schema delle rime'+tag("r3.A")+'</h3><p>Assegnate una lettera a ogni verso a partire dalla parola in rima: stessa lettera, stessa rima.</p>';
  RIMA.forEach(function(w,i){h+='<div class="rm'+(bad.indexOf(i)>=0?' bad':'')+'"><span class="no">'+(i+1)+'</span><span style="font-family:var(--display);font-size:1.15rem">'+w+'</span>'+selH("r3.rm."+i,["","A","B","C","D","E"],dA,"Rima del verso "+(i+1))+'</div>'});
  h+='<div class="row" style="margin-top:12px;align-items:flex-start"><div style="flex:1;min-width:200px"><label class="eyebrow" for="f-r3.q1">Le due strofe iniziali, di 4 versi, sono</label>'+selH("r3.q1",["","quartine","terzine","distici"],dA)+'</div>'+
  '<div style="flex:1;min-width:200px"><label class="eyebrow" for="f-r3.q2">Le due strofe finali, di 3 versi, sono</label>'+selH("r3.q2",["","quartine","terzine","distici"],dA)+'</div>'+
  '<div style="flex:1;min-width:200px"><label class="eyebrow" for="f-r3.q3">I versi sono</label>'+selH("r3.q3",["","endecasillabi","settenari","novenari"],dA)+'</div>'+
  '<div style="flex:1;min-width:200px"><label class="eyebrow" for="f-r3.q4">Lo schema delle terzine è</label>'+selH("r3.q4",["","ripetuto (CDE CDE)","invertito (CDE EDC)","alternato (CDC DCD)"],dA)+'</div>'+
  '<div style="flex:1;min-width:200px"><label class="eyebrow" for="f-r3.end">Terminazione comune della rima A</label><input type="text" id="f-r3.end" data-k="r3.end" value="'+esc(A("r3.end"))+'"'+(dA?' disabled':'')+'></div></div>'+
  (dA?'':'<div style="margin-top:12px"><button class="btn pri" type="button" data-act="r3A">Controlla lo schema</button></div>')+FB("r3.A")+'</div>';
  if(dA){
    var dB=D("r3.B");
    function sylRow(key,obj){var s=S.a["r3."+key]||[];return '<div class="syl">'+obj.s.map(function(t,i){return '<button type="button" class="'+(s.indexOf(i+1)>=0?'on':'')+'" data-act="syl" data-v="'+key+':'+(i+1)+'" aria-pressed="'+(s.indexOf(i+1)>=0)+'"'+(dB?' disabled':'')+'>'+esc(t)+'<small>'+(i+1)+'</small></button>'}).join("")+'</div>'}
    h+='<div class="card prova"><div class="eyebrow">Prova B</div><h3>La scansione'+tag("r3.B")+'</h3><p>Le sillabe sono già divise. Tocca le sillabe su cui cade un accento principale.</p>'+
    '<b>v. 2</b> <span class="muted">che fa tremar di chiaritate l’âre</span>'+sylRow("s2",SYL2)+
    '<div style="margin-top:12px"><b>v. 7</b> <span class="muted">cotanto d’umiltà donna mi pare</span></div>'+sylRow("s7",SYL7)+
    '<div class="row" style="margin-top:12px;align-items:flex-start"><div style="flex:1;min-width:200px"><label class="eyebrow" for="f-r3.sill">Quante sillabe valgono i due versi?</label>'+selH("r3.sill",["","10","11","12"],dB)+'</div>'+
    '<div style="flex:1;min-width:200px"><label class="eyebrow" for="f-r3.piane">Le parole in rima sono tutte</label>'+selH("r3.piane",[["","— scegli —"],["piane","piane (accento sulla penultima)"],["tronche","tronche (accento sull’ultima)"],["sdrucciole","sdrucciole (accento sulla terzultima)"]],dB)+'</div>'+
    '<div style="flex:1;min-width:200px"><label class="eyebrow" for="f-r3.rit">Il ritmo dei due versi è</label>'+selH("r3.rit",["","regolare e fluido","spezzato e irregolare"],dB)+'</div></div>'+
    '<p style="margin:14px 0 6px">Il v. 2 descrive una luce che fa tremare l’aria, ma i suoni sono dolci e il ritmo scorre senza urti. Che effetto nasce da questa scelta, in un sonetto che parla di una donna quasi sovrumana?</p>'+ta("r3.Bw","",20,0,3)+
    (dB?'':'<div style="margin-top:10px"><button class="btn pri" type="button" data-act="r3B">Controlla la scansione</button></div>')+FB("r3.B")+'</div>';
  }
  if(D("r3.B")){
    var dC=D("r3.C"),fb=S.a["r3.fbad"]||[];
    h+='<div class="card prova"><div class="eyebrow">Prova C</div><h3>La caccia alle figure'+tag("r3.C")+'</h3><p>Abbinate a ogni passo la figura che lo definisce meglio.</p>'+
    '<details><summary>Promemoria</summary><p class="muted" style="margin:8px 0 0">Personificazione: azioni umane attribuite a un’entità astratta. Antitesi: due idee opposte. Anafora: stessa parola all’inizio di versi diversi. Enjambement: la frase continua nel verso seguente. Ripresa: una parola o un concetto ritorna a distanza. Interrogativa: domanda posta dal poeta. Metafora: trasferimento di significato. Iperbole: esagerazione.</p></details>'+
    FIG.map(function(f,i){return '<div class="rm'+(fb.indexOf(i)>=0?' bad':'')+'" style="grid-template-columns:1fr minmax(170px,.6fr)"><span style="font-family:var(--display);font-size:1.1rem">'+f[0]+'</span>'+selH("r3.fg."+i,[""].concat(FIGOPT),dC,"Figura del passo "+(i+1))+'</div>'}).join("")+
    (dC?'':'<div style="margin-top:12px"><button class="btn pri" type="button" data-act="r3C">Controlla le figure</button></div>')+FB("r3.C")+'</div>';
  }
  if(D("r3.C")){
    var dD=D("r3.D");
    h+='<div class="card prova"><div class="eyebrow">Prova D</div><h3>Sintassi e metro'+tag("r3.D")+'</h3><p>Contate i periodi del sonetto. Un periodo si chiude con un punto, un punto esclamativo o un punto interrogativo; i due punti non lo chiudono.</p><div class="row" style="align-items:flex-start"><div style="flex:1;min-width:200px"><label class="eyebrow" for="f-r3.per">Quanti periodi ci sono?</label>'+selH("r3.per",["","3","4","5","6"],dD)+'</div><div style="flex:1;min-width:200px"><label class="eyebrow" for="f-r3.coin">Ogni periodo coincide con una strofa?</label>'+selH("r3.coin",["","sì","no"],dD)+'</div><div style="flex:1;min-width:200px"><label class="eyebrow" for="f-r3.str">Quale strofa contiene più di un periodo?</label>'+selH("r3.str",["","prima quartina","seconda quartina","prima terzina","seconda terzina"],dD)+'</div></div>'+
    (dD?'':'<div style="margin-top:12px"><button class="btn pri" type="button" data-act="r3D">Controlla</button></div>')+FB("r3.D")+'</div>';
  }
  if(D("r3.D"))h+=sigCard(2);
  return h;
};
/* ---- stanza 4 ---- */
function twNorm(w){var n=norm(w);var p=n.split("'");return p[p.length-1]}
ACT.tw=function(el){if(D("r4.A"))return;var s=S.a["r4.sel"]||[],v=el.dataset.v,i=s.indexOf(v);if(i>=0)s.splice(i,1);else s.push(v);S.a["r4.sel"]=s;S.fb["r4.A"]=null;save()};
function r4words(){var s=S.a["r4.sel"]||[],out=[];s.forEach(function(id){var p=id.split("-");out.push(twNorm(DANTE[+p[0]].split(" ")[+p[1]]))});return out}
ACT.r4A=function(){
  var w=r4words(),wrong=w.filter(function(x){return TWINS.indexOf(x)<0&&x!=="li"}).length,found=TWINS.filter(function(t){return w.indexOf(t)>=0}).length;
  if(!w.length)return setFb("r4.A","bad","Tocca le parole di Dante che hanno una gemella in «Chi è questa che vén».");
  if(wrong)return setFb("r4.A","bad",wrong+" "+(wrong>1?"parole segnalate non hanno":"parola segnalata non ha")+" una vera gemella (attenzione: la stessa radice può avere un altro significato). Gemelle trovate: "+found+" su "+TWINS.length+".");
  if(found<TWINS.length)return setFb("r4.A","bad","Gemelle trovate: "+found+" su "+TWINS.length+". Ne mancano ancora.");
  S.d["r4.A"]=true;setFb("r4.A","good","Sei parole gemelle trovate.");
};
ACT.r4B=function(){
  var bad=[];TW.forEach(function(t,i){if(A("r4.tw."+i+".a")!==String(t[3])||A("r4.tw."+i+".b")!==String(t[6]))bad.push(i)});
  S.a["r4.bad"]=bad;
  if(bad.length)return setFb("r4.B","bad",(TW.length-bad.length)+" coppie su "+TW.length+" sono giuste. Quelle in rosso vanno riviste: rileggete i due testi.");
  S.d["r4.B"]=true;setFb("r4.B","good","Stesse parole, usate in modi diversi.");
};
ACT.r4C=function(){
  if(wc(A("r4.C"))<45)return setFb("r4.C","bad","Servono più argomenti: citate almeno tre parole gemelle.");
  S.d["r4.C"]=true;setFb("r4.C","good","Confronto consegnato.");
};
ACT.gn=function(el){if(D("r4.D"))return;var s=S.a["r4.gn"]||[],v=el.dataset.v,i=s.indexOf(v);if(i>=0)s.splice(i,1);else if(s.length<4)s.push(v);S.a["r4.gn"]=s;S.fb["r4.D"]=null;save()};
ACT.r4D=function(){
  var s=S.a["r4.gn"]||[];
  if(s.length!==4)return setFb("r4.D","bad","Scegliete esattamente quattro parole.");
  if(!GUIN_OK.every(function(x){return s.indexOf(x)>=0}))return setFb("r4.D","bad","Non sono tutte giuste. Cercate le parole che nel sonetto stanno al posto più in vista del verso e che Guinizelli aveva già usato.");
  if(wc(A("r4.Dw"))<30)return setFb("r4.D","bad","Le parole sono giuste. Rispondete ora alla domanda sul superamento del modello.");
  S.d["r4.D"]=true;setFb("r4.D","good","Eco di Guinizelli riconosciuta.");
};
ROOMV.r4=function(){
